openapi: 3.2.0
info:
  title: Wagepoint Public Persons API
  description: Public REST API for partners and integrations to access Wagepoint Company, Person, Pay Group, and Time data.
  version: v1
servers:
- url: /api
tags:
- name: Persons
paths:
  /v1/companies/{company_id}/persons:
    get:
      tags:
      - Persons
      operationId: ListPersons
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: page_size
        in: query
        description: Page size, 1..100. Defaults to 100. Free per request; it should remain constant across a page sequence because ordering is unstable and a sequence is not a consistent snapshot.
        schema:
          type: integer
          format: int32
      - name: after
        in: query
        description: Opaque, forward-only pagination cursor. Do not decode or construct it; resend it verbatim. A page sequence is not a consistent snapshot; changing page_size mid-sequence can skip or duplicate persons.
        schema:
          type: string
      responses:
        '200':
          description: A page of persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paged_response_person_response'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '422':
          description: A value could not be converted to the expected type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '502':
          description: Upstream bad response or contract violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '503':
          description: Upstream unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '504':
          description: Upstream timeout
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '401':
          description: Missing or invalid token
      security:
      - bearerAuth: []
      summary: List persons
      x-summary-source: derived
components:
  schemas:
    person_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        company_id:
          type: integer
          format: int32
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        person_type:
          enum:
          - not_defined
          - employee
          - contractor
          - other
          type: string
          default: not_defined
        status:
          enum:
          - not_defined
          - not_specified
          - active
          - terminated
          - on_leave
          - terminated_pending
          - on_leave_pending
          - disabled
          - pending
          - incomplete_profile
          - deleted
          type:
          - string
          - 'null'
          default: not_defined
        hire_date:
          type:
          - string
          - 'null'
          format: date
        address:
          $ref: '#/components/schemas/person_address_response'
    page_info:
      type: object
      properties:
        after:
          type: string
        page_size:
          type: integer
          format: int32
        has_more:
          type: boolean
    problem_details:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type: string
        instance:
          type: string
        extensions:
          type: object
          additionalProperties:
            type: object
    paged_response_person_response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/person_response'
        page_info:
          $ref: '#/components/schemas/page_info'
    person_address_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

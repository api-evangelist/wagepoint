openapi: 3.2.0
info:
  title: Wagepoint Public Health API
  description: Public REST API for partners and integrations to access Wagepoint Company, Person, Pay Group, and Time data.
  version: v1
servers:
- url: /api
tags:
- name: Health
paths:
  /health:
    get:
      tags:
      - Health
      operationId: Health
      responses:
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Service is healthy
      summary: Health
      x-summary-source: derived
  /alive:
    get:
      tags:
      - Health
      operationId: Alive
      responses:
        '200':
          description: Service is alive
      summary: Alive
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

openapi: 3.2.0
info:
  title: Wagepoint Public Pay Groups API
  description: Public REST API for partners and integrations to access Wagepoint Company, Person, Pay Group, and Time data.
  version: v1
servers:
- url: /api
tags:
- name: Pay Groups
paths:
  /v1/companies/{company_id}/pay-groups:
    get:
      tags:
      - Pay Groups
      operationId: ListPayGroups
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Active pay groups for the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_items_response_pay_group_response'
        '400':
          description: validation_error, upstream_bad_request, idempotency_not_supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '401':
          description: unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '403':
          description: forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '422':
          description: invalid_type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '500':
          description: internal_error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '502':
          description: upstream_bad_response, upstream_contract_violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '503':
          description: upstream_unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '504':
          description: upstream_timeout
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
      security:
      - bearerAuth: []
      summary: List pay groups
      x-summary-source: derived
components:
  schemas:
    pay_group_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        is_auto_run:
          type: boolean
    list_items_response_pay_group_response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/pay_group_response'
    problem_details:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type: string
        instance:
          type: string
        extensions:
          type: object
          additionalProperties:
            type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

openapi: 3.2.0
info:
  title: Wagepoint Public MCP API
  description: Public REST API for partners and integrations to access Wagepoint Company, Person, Pay Group, and Time data.
  version: v1
servers:
- url: /api
tags:
- name: MCP
paths:
  /mcp/client-metadata.json:
    get:
      tags:
      - MCP
      operationId: GetMcpClientMetadata
      responses:
        '200':
          description: CIMD document for the Wagepoint MCP STDIO bundle
          content:
            application/json:
              schema:
                type: object
        '404':
          description: CIMD client URL is not configured
      summary: Get mcp client metadata
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

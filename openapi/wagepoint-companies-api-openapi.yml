openapi: 3.2.0
info:
  title: Wagepoint Public Companies API
  description: Public REST API for partners and integrations to access Wagepoint Company, Person, Pay Group, and Time data.
  version: v1
servers:
- url: /api
tags:
- name: Companies
paths:
  /v1/companies/{company_id}:
    get:
      tags:
      - Companies
      operationId: GetCompany
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The requested company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/company_response'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '404':
          description: Company not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '401':
          description: Missing or invalid token
      security:
      - bearerAuth: []
      summary: Get company
      x-summary-source: derived
  /v1/companies:
    get:
      tags:
      - Companies
      operationId: ListCompanies
      parameters:
      - name: page_size
        in: query
        description: Page size, 1..100. Defaults to 100. On a follow-up request it must match the cursor.
        schema:
          type: integer
          format: int32
      - name: name
        in: query
        description: Case-insensitive name prefix filter.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by a single company status value (snake_case, e.g. active).
        schema:
          type: string
      - name: id
        in: query
        description: Repeated company id filter, e.g. ?id=1&id=2.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: after
        in: query
        description: Opaque, forward-only pagination cursor. Do not decode or construct it; resend it verbatim.
        schema:
          type: string
      responses:
        '200':
          description: A page of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paged_response_company_list_item_response'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '422':
          description: A value could not be converted to the expected type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problem_details'
        '401':
          description: Missing or invalid token
      security:
      - bearerAuth: []
      summary: List companies
      x-summary-source: derived
components:
  schemas:
    company_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        dba:
          type: string
        company_code:
          type: string
        status:
          enum:
          - not_defined
          - waiting_data
          - pending_verification
          - active
          - inactive
          - close_initiated
          - close_pending
          - closed
          - expired
          - banned
          type: string
          default: not_defined
        phone_number:
          type: string
        primary_address:
          $ref: '#/components/schemas/address_response'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/location_response'
        created_at:
          type: string
          format: date-time
    page_info:
      type: object
      properties:
        after:
          type: string
        page_size:
          type: integer
          format: int32
        has_more:
          type: boolean
    paged_response_company_list_item_response:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/company_list_item_response'
        page_info:
          $ref: '#/components/schemas/page_info'
    location_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        location_type:
          enum:
          - not_defined
          - not_specified
          - headquarters
          type: string
          default: not_defined
        is_primary:
          type: boolean
        address:
          $ref: '#/components/schemas/address_response'
    address_response:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
    company_list_item_response:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        dba:
          type: string
        company_code:
          type: string
        status:
          enum:
          - not_defined
          - waiting_data
          - pending_verification
          - active
          - inactive
          - close_initiated
          - close_pending
          - closed
          - expired
          - banned
          type: string
          default: not_defined
    problem_details:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type: string
        instance:
          type: string
        extensions:
          type: object
          additionalProperties:
            type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
